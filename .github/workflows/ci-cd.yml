name: CI

# 每次 push 到 main 分支就觸發
on:
  push:
    branches: [main]

# 讓 workflow 有權限把映像推到 GitHub Container Registry
permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: account-app

jobs:
  # ---- 工作一:測試 ----
  test:
    name: 測試與程式碼檢查
    runs-on: ubuntu-latest
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝依賴
        run: pip install -r requirements-dev.txt

      - name: 程式碼風格檢查
        run: flake8 app.py --max-line-length=120

      - name: 執行單元測試
        run: pytest tests/ -v

  # ---- 工作二:建置並推送映像 ----
  build-and-push:
    name: 建置並推送 Docker 映像
    needs: test          # 測試通過才會執行
    runs-on: ubuntu-latest
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 準備小寫的帳號名稱
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: 登入 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 建置並推送映像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/${{ env.IMAGE_NAME }}:latest