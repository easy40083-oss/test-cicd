<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>帳號申請</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif;
      background: #f0f2f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 420px;
      padding: 36px;
    }
    h1 { font-size: 22px; margin-bottom: 4px; color: #1a1a2e; }
    .subtitle { color: #888; font-size: 13px; margin-bottom: 24px; }
    label { display: block; font-size: 14px; color: #444; margin: 14px 0 6px; }
    input {
      width: 100%;
      padding: 11px 13px;
      border: 1px solid #d5d9e0;
      border-radius: 8px;
      font-size: 15px;
      transition: border-color .15s;
    }
    input:focus { outline: none; border-color: #4361ee; }
    button {
      width: 100%;
      margin-top: 24px;
      padding: 12px;
      background: #4361ee;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background .15s;
    }
    button:hover { background: #3a56d4; }
    .flash {
      background: #fde8e8;
      color: #c81e1e;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 16px;
    }
    .footer { text-align: center; margin-top: 20px; font-size: 12px; color: #aab; }
    .footer a { color: #4361ee; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>帳號申請</h1>
    <p class="subtitle">請填寫以下資料完成申請</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form action="{{ url_for('register') }}" method="post">
      <label>姓名</label>
      <input type="text" name="name" placeholder="王小明" required>

      <label>工號</label>
      <input type="text" name="emp_id" placeholder="E12345" required>

      <label>帳號</label>
      <input type="text" name="username" placeholder="登入用帳號" required>

      <label>密碼</label>
      <input type="password" name="password" placeholder="至少 6 碼" required>

      <label>電話</label>
      <input type="tel" name="phone" placeholder="0912345678" required>

      <button type="submit">送出申請</button>
    </form>

    <p class="footer">
      版本 {{ version }} &middot; <a href="{{ url_for('list_accounts') }}">查看已申請清單</a>
    </p>
  </div>
</body>
</html>
